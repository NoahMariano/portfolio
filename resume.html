<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noah Mariano — Resume</title>
    <meta name="description" content="Resume for Noah Mariano.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,620&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      try {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#resume">Skip to content</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="wordmark" href="index.html">Noah Mariano</a>
        <nav id="site-nav" class="nav" data-nav aria-label="Sections">
          <a href="index.html#about">About</a>
          <a href="index.html#work">Work</a>
          <a href="index.html#contact">Contact</a>
          <a href="resume.html" aria-current="page">Resume</a>
        </nav>
        <div class="header-actions">
          <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-nav">
            Menu
          </button>
          <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
            Dark mode
          </button>
        </div>
      </div>
    </header>

    <main id="resume" class="wrap section resume-page">
      <p class="eyebrow">Resume</p>
      <h1>Noah Mariano</h1>
      <p class="lede">Student in Worcester, MA, focused on computer engineering and power systems.</p>
      <p data-resume-missing>
        Save your resume PDF in this folder as <code>resume.pdf</code>. This page will show it here.
      </p>
      <iframe class="resume-frame" data-resume-embed src="resume.pdf" title="Noah Mariano resume" hidden></iframe>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© <span data-year>2026</span> Noah Mariano</p>
        <p>Built by hand. Hosted with GitHub Pages.</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
